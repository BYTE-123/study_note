<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>笔记详情 · 个人笔记</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/note.css">
</head>
<body class="bg-parchment" data-page="note">
  <header class="app-nav">
    <a class="app-nav__brand" href="/">
      <img src="/static/img/logo.svg" alt="个人笔记" width="28" height="28">
      <span>个人笔记</span>
    </a>
    <nav class="app-nav__links"></nav>
  </header>

  <main class="app-main">
    <a class="note-back" href="/notes">← 返回列表</a>

    <article class="card note-card" id="note-card">
      <div class="note-head">
        <h1 class="note-title" id="note-title">加载中…</h1>
        <div class="note-actions" id="note-actions" hidden>
          <a class="note-action" id="edit-link" href="#">✎ 编辑</a>
          <button class="note-action note-action--danger" id="delete-btn" type="button">🗑 删除</button>
        </div>
      </div>
      <div class="note-meta" id="note-meta"></div>
      <div class="note-body" id="note-body"></div>
      <div class="note-fav-row">
        <button class="fav-btn" id="favorite-btn" type="button" aria-pressed="false"
                title="收藏">
          <span class="fav-btn__icon" aria-hidden="true">♡</span>
          <span class="fav-btn__text">收藏</span>
        </button>
      </div>
    </article>

    <div id="note-error" class="state-block" hidden></div>

    <!-- 分享设置卡（契约 10.2：开关 + 链接 + 复制 + 密码 + 保存） -->
    <section id="share-panel" class="note-panel-slot">
      <article class="card share-card" id="share-card" hidden>
        <div class="share-head">
          <h2 class="share-title">分享设置</h2>
          <button class="btn btn-ghost btn-sm" id="share-collapse" type="button"
                  aria-expanded="true" aria-controls="share-body">收起</button>
        </div>

        <div class="share-body" id="share-body">
          <div class="share-switch-row">
            <label class="share-switch">
              <input type="checkbox" id="share-switch" role="switch" aria-label="开启分享">
              <span class="share-switch__track" aria-hidden="true"></span>
              <span class="share-switch__text">开启分享</span>
            </label>
            <p class="share-hint">开启后，任何人都可通过链接查看这篇笔记。</p>
          </div>

          <div class="share-link-row" id="share-link-row" hidden>
            <input class="share-link-input" id="share-link" type="text" readonly
                   aria-label="分享链接" title="分享链接">
            <button class="btn btn-sm" id="copy-btn" type="button">复制</button>
          </div>

          <div class="share-password-row">
            <input class="share-password-input" id="share-password" type="password"
                   placeholder="输入新密码（留空移除）" aria-label="分享密码"
                   autocomplete="new-password">
            <button class="btn btn-sm" id="save-password-btn" type="button">保存密码</button>
          </div>
        </div>
      </article>
    </section>
    <!-- Phase 5 评论区：由 comments-ui.js 渲染（标题 + 开关 + 列表 + 输入框） -->
    <section id="comment-panel" class="note-panel-slot" aria-label="评论区"></section>
  </main>

  <footer class="app-footer">
    用心记录，让知识更有价值。© 个人笔记
  </footer>

  <script src="/static/js/vendor/marked.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/comments-ui.js"></script>
  <script src="/static/js/note.js"></script>
</body>
</html>
