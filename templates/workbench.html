<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台 · 个人笔记</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/workbench.css">
</head>
<body class="bg-parchment" data-page="workbench">
  <header class="app-nav">
    <a class="app-nav__brand" href="/">
      <img src="/static/img/logo.svg" alt="个人笔记" width="28" height="28">
      <span>个人笔记</span>
    </a>
    <nav class="app-nav__links"></nav>
  </header>

  <main class="app-main">
    <div class="page-head">
      <h1 class="page-title">工作台</h1>
      <div class="page-actions">
        <a class="btn btn-primary" href="/editor">新建文章</a>
        <a class="btn" href="/notes">我的文章</a>
      </div>
    </div>

    <section class="stat-grid" id="stats" aria-label="笔记统计">
      <article class="stat-card skeleton" data-stat="draft">
        <p class="stat-card__value">—</p>
        <p class="stat-card__label">草稿</p>
      </article>
      <article class="stat-card skeleton" data-stat="published">
        <p class="stat-card__value">—</p>
        <p class="stat-card__label">已发布</p>
      </article>
      <article class="stat-card skeleton" data-stat="favorite">
        <p class="stat-card__value">—</p>
        <p class="stat-card__label">收藏</p>
      </article>
    </section>

    <section class="panel" id="recent-panel" aria-label="最近文章">
      <h2 class="panel__title">最近文章</h2>
      <div id="recent-list">
        <p class="state-block">加载中…</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    用心记录，让知识更有价值。© 个人笔记
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/workbench.js"></script>
</body>
</html>
