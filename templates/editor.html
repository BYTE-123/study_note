<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写笔记 · 个人笔记</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/editor.css">
</head>
<body class="bg-parchment" data-page="editor">
  <header class="app-nav">
    <a class="app-nav__brand" href="/">
      <img src="/static/img/logo.svg" alt="个人笔记" width="28" height="28">
      <span>个人笔记</span>
    </a>
    <nav class="app-nav__links"></nav>
  </header>

  <main class="app-main">
    <div class="editor-top">
      <a class="editor-back" href="/notes">← 返回</a>
      <div class="editor-actions">
        <button class="btn" id="save-draft" type="button">保存草稿</button>
        <button class="btn btn-primary" id="publish" type="button">发布文章</button>
      </div>
    </div>

    <section class="editor-card">
      <input class="editor-title" id="title" type="text" maxlength="100"
             placeholder="文章标题…" aria-label="文章标题">

      <div class="editor-tags">
        <span class="editor-tags__label">标签：</span>
        <input class="editor-tags__input" id="tags" type="text" maxlength="100"
               placeholder="用逗号分隔，例如：生活,工作,随笔" aria-label="标签">
      </div>

      <div class="editor-toolbar" id="toolbar" role="toolbar" aria-label="Markdown 工具栏">
        <button type="button" class="tool-btn" data-syntax="h1" title="一级标题" aria-label="一级标题">H1</button>
        <button type="button" class="tool-btn" data-syntax="h2" title="二级标题" aria-label="二级标题">H2</button>
        <button type="button" class="tool-btn" data-syntax="bold" title="加粗" aria-label="加粗"><strong>B</strong></button>
        <button type="button" class="tool-btn" data-syntax="italic" title="斜体" aria-label="斜体"><em>I</em></button>
        <button type="button" class="tool-btn" data-syntax="code" title="行内代码" aria-label="行内代码">&lt;/&gt;</button>
        <button type="button" class="tool-btn" data-syntax="quote" title="引用" aria-label="引用">&gt;</button>
        <button type="button" class="tool-btn" data-syntax="ul" title="无序列表" aria-label="无序列表">≡</button>
        <button type="button" class="tool-btn" data-syntax="ol" title="有序列表" aria-label="有序列表">⋮≡</button>
        <button type="button" class="tool-btn" data-syntax="link" title="链接" aria-label="链接">🔗</button>
        <button type="button" class="tool-btn" data-syntax="image" title="图片" aria-label="图片">🖼</button>
        <button type="button" class="tool-btn tool-preview" id="preview-toggle"
                aria-pressed="false" title="预览">👁 预览</button>
      </div>

      <textarea class="editor-content" id="content" aria-label="正文" placeholder="开始书写你的笔记…

支持 Markdown 语法：
# 标题
**加粗**  *斜体*
&gt; 引用
`代码`"></textarea>

      <div class="editor-preview" id="preview" hidden></div>

      <!-- 图片上传：由工具栏「图片」按钮点击触发，选文件后调 /api/upload -->
      <input type="file" id="image-input" hidden
             accept="image/jpeg,image/png,image/gif,image/webp" aria-hidden="true">
    </section>
  </main>

  <footer class="app-footer">
    用心记录，让知识更有价值。© 个人笔记
  </footer>

  <!-- AI 润色：自定义右键菜单（仅划词时出现，契约 10.4） -->
  <div id="editor-context-menu" class="context-menu" hidden>
    <button type="button" class="context-menu__item" data-action="polish">✨ AI 润色</button>
  </div>

  <!-- AI 润色：左右对比弹窗（契约 10.2 / 10.4 / 10.5） -->
  <div class="polish-backdrop" id="polish-modal" hidden>
    <div class="polish-dialog" role="dialog" aria-modal="true"
         aria-labelledby="polish-title" tabindex="-1">
      <div class="polish-head">
        <h2 class="polish-title" id="polish-title">✨ AI 文本润色</h2>
        <button type="button" class="polish-close" id="polish-close" aria-label="关闭">×</button>
      </div>

      <div class="polish-grid">
        <section class="polish-col">
          <h3 class="polish-col__title">原文</h3>
          <div class="polish-col__body" id="polish-source"></div>
        </section>
        <section class="polish-col">
          <h3 class="polish-col__title">润色结果</h3>
          <div class="polish-col__body" id="polish-result-col">
            <div class="polish-stream" id="polish-result"></div>
            <div class="polish-state" id="polish-state">
              <span class="polish-state__spinner" id="polish-spinner" aria-hidden="true"></span>
              <span class="polish-state__text" id="polish-state-text" role="status">润色中…</span>
              <button type="button" class="btn btn-sm" id="polish-retry" hidden>重试</button>
            </div>
          </div>
        </section>
      </div>

      <div class="polish-foot">
        <button type="button" class="btn" id="polish-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="polish-apply" disabled>确认替换</button>
      </div>
    </div>
  </div>

  <script src="/static/js/vendor/marked.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/ai-polish.js"></script>
  <script src="/static/js/editor.js"></script>
</body>
</html>
